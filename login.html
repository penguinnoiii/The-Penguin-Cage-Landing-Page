<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Penguin Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1 class="logo">Penguin Cafe</h1>
        <div class="nav-actions">
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
            <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="menu-hero">
        <div class="menu-hero-content">
            <h2>Member Login</h2>
            <p>Sign in to view your cart and checkout faster.</p>
        </div>
    </section>

    <section class="menu-section" style="max-width:480px;margin:40px auto;">
        <form id="login-form">
            <label for="username">Username</label><br>
            <input id="username" name="username" type="text" placeholder="Your name" required style="width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;">
            <label for="email">Email</label><br>
            <input id="email" name="email" type="email" placeholder="you@example.com" required style="width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;">
            <button type="submit" class="btn" style="display:inline-block;margin-top:10px;">Sign In</button>
        </form>
        <p id="login-message" style="margin-top:12px;color:var(--muted);"></p>
    </section>

    <footer>
        <p>&copy; 2026 The Penguin Cafe. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
